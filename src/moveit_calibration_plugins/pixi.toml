[package.build.source]
git = "https://github.com/XingxinHE/moveit_calibration.git"
rev = "45671147c6a443acd61a27aa796305093d2ea590"
subdirectory = "moveit_calibration_plugins"

[package.build.backend]
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/robostack-humble",
    "https://prefix.dev/conda-forge"
]
name = "pixi-build-ros"
version = "*"

[package.build.config]
distro = "humble"

[package]
name = "ros-humble-moveit-calibration-plugins"
version = "2.0.0"

[package.build-dependencies]
python = "3.12.*"

[package.host-dependencies]
python = "3.12.*"

[package.run-dependencies]
python = "3.12.*"

[workspace]
channels = [
    "https://prefix.dev/robostack-humble",
    "https://prefix.dev/conda-forge"
]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
ros-humble-moveit-calibration-plugins = { path = "." }
