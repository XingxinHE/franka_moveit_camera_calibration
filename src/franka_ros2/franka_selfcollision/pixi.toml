[package.build.source]
git = "https://github.com/frankarobotics/franka_ros2.git"
rev = "ce8cc0bd853092b936be12f97895fb31294a5743"
subdirectory = "franka_selfcollision"

[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
name = "pixi-build-ros"
version = "*"

[package.build.config]
distro = "jazzy"

[package.build-dependencies]
ros-jazzy-franka-msgs = { path = "../franka_msgs" }

[package.host-dependencies]
ros-jazzy-franka-msgs = { path = "../franka_msgs" }
ros-jazzy-srdfdom = "*"
ros-jazzy-urdf = "*"

[package.run-dependencies]
ros-jazzy-franka-msgs = { path = "../franka_msgs" }

[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64"]
preview = ["pixi-build"]
