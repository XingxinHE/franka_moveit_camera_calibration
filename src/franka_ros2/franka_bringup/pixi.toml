[package.build.source]
git = "https://github.com/frankarobotics/franka_ros2.git"
rev = "7ef0ab00964a0d2b5e19e9292bbcef9f32dda811"
subdirectory = "franka_bringup"

[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-humble",
  "https://conda.anaconda.org/conda-forge",
]
name = "pixi-build-ros"
version = "*"

[package.build.config]
distro = "humble"

[package.build-dependencies]
python = "3.12.*"

[package.host-dependencies]
python = "3.12.*"
ros-humble-franka-description = { path = "../../franka_description" }
ros-humble-franka-hardware = { path = "../franka_hardware" }
ros-humble-franka-robot-state-broadcaster = { path = "../franka_robot_state_broadcaster" }

[package.run-dependencies]
ros-humble-franka-description = { path = "../../franka_description" }
ros-humble-franka-hardware = { path = "../franka_hardware" }
ros-humble-franka-robot-state-broadcaster = { path = "../franka_robot_state_broadcaster" }

[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-humble",
  "https://conda.anaconda.org/conda-forge",
]
platforms = ["linux-64"]
preview = ["pixi-build"]
