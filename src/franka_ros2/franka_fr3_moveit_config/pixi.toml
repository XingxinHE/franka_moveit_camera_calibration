[package.build.source]
git = "https://github.com/frankarobotics/franka_ros2.git"
rev = "ce8cc0bd853092b936be12f97895fb31294a5743"
subdirectory = "franka_fr3_moveit_config"

[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
name = "pixi-build-ros"
version = "*"

[package.build.config]
distro = "jazzy"

[package.host-dependencies]
ros-jazzy-franka-description = { path = "../../franka_description" }
ros-jazzy-franka-hardware = { path = "../franka_hardware" }
ros-jazzy-franka-gripper = { path = "../franka_gripper" }

[package.run-dependencies]
ros-jazzy-franka-description = { path = "../../franka_description" }
ros-jazzy-franka-hardware = { path = "../franka_hardware" }
ros-jazzy-franka-gripper = { path = "../franka_gripper" }

[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64"]
preview = ["pixi-build"]
